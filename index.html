const qtyOf=id=>Object.keys(cart).filter(k=>k.split("|")[0]==id).reduce((a,k)=>a+cart[k].q,0);
const gqty=g=>g.ids.reduce((a,id)=>a+qtyOf(id),0);
const txt=p=>(p.title+" "+p.desc+" "+p.codes.join(" ")+" "+p.variants.map(v=>v.label).join(" ")).toLowerCase();
const vlabel=(p,vi)=>{const v=p.variants[vi];return v?((v.label?v.label+" ":"")+"("+v.code+")"):""};
const HDOK={};const hdUrl=i=>"hd/"+String(i+1).padStart(4,"0")+".jpg";const imgSrc=i=>HDOK[i]||GROUPS[i].img;
function refreshImgs(){if(curG<0)return;const a=document.querySelector("#mbox .ph img");if(a)a.src=imgSrc(curG);if($("#zoom").classList.contains("open"))$("#zi").src=imgSrc(curG)}
function hdLoad(i){if(i<0||i>=GROUPS.length||HDOK[i]||location.protocol==="blob:")return;const im=new Image();im.onload=()=>{HDOK[i]=hdUrl(i);if(i===curG)refreshImgs()};im.src=hdUrl(i)}
let curG=-1;
function visible(){const q=$("#q").value.toLowerCase().trim(),emp=$("#emp").value;
 return GROUPS.map((g,i)=>({g,i})).filter(({g})=>(!emp||g.emp===emp)&&(!q||g.ids.some(id=>txt(byId(id)).includes(q))))}
function render(){$("#grid").innerHTML=visible().map(({g,i})=>{const its=g.ids.map(byId),n=gqty(g),ps=its.map(p=>p.price&&lowP(p)).filter(Boolean);
 return`<div class="card ${n?"in":""}" onclick="openG(${i})">${n?`<span class="badge">✓ En el carrito ×${n}</span>`:""}<img loading="lazy" src="${g.img}" alt=""><div class="b"><div class="emp">${g.emp} · pág. ${g.page}</div>
 <div class="t">${its[0].title}${its.length>1?` y ${its.length-1} más`:""}</div><div class="mut">${its.length} ${its.length>1?"productos":"producto"}${ps.length?" · desde "+money(Math.min(...ps)):""}</div></div></div>`}).join("")}
const lowP=p=>p.tier?Math.min(p.price,...p.tier.map(t=>t[1])):p.pack?Math.min(p.price,Math.round(p.pack[1]/p.pack[0])):p.price;
const promoQty=p=>p.pack?p.pack[0]:p.tier?p.tier[0][0]:0;
function tiersHTML(p){if(!p.tier&&!p.pack)return"";let h='<div class="tiers"><div class="tr"><span>1 unidad</span><b>'+money(p.price)+'</b></div>';
 if(p.tier)p.tier.forEach(([mn,pr])=>{h+=`<div class="tr promo"><span>${mn} unidades${p.tier.length>1&&mn===p.tier[p.tier.length-1][0]?" o más":(p.tier.length==1?" o más":"")}</span><b>${money(pr)} c/u</b></div>`});
 if(p.pack){const[n,t]=p.pack;h+=`<div class="tr promo"><span>Llevando ${n}</span><b>${money(t)} <small>(${money(Math.round(t/n))} c/u)</small></b></div>`}
 return h+'<div class="mut" style="font-size:11px">Se combina con otros productos con promo de esta página.</div></div>'}
function rowHTML(id,q){const p=byId(id),hit=q&&txt(p).includes(q),pq=promoQty(p);
 return`<div class="row ${hit?"hit":""}"><div class="t">${p.title}</div>${p.desc?`<div class="d">${p.desc}</div>`:""}
 <div class="pr">${p.regular?`<span class="reg">${money(p.regular)}</span>`:""}<span class="p">${p.price?money(p.price)+((p.tier||p.pack)?" <small style='font-size:11px;font-weight:400;color:var(--mut)'>1 unidad</small>":"")+(p.pnote?` <small style="font-size:11px;font-weight:400;color:var(--mut)">${p.pnote}</small>`:""):"Consultar"}</span>${p.points?`<span class="mut">${p.points} pts</span>`:""}</div>
 ${tiersHTML(p)}
 ${p.review?'<span class="tag">Revisar datos</span>':""}
 ${p.variants.length>1?`<div class="opts">${p.variants.map((v,i)=>`<label class="opt"><input type="radio" name="r${id}" value="${i}" ${i==0?"checked":""}><span><b>${v.label||"Opción "+(i+1)}</b><small>Cód. ${v.code}${v.pts?" · "+v.pts+" pts":""}</small></span></label>`).join("")}</div>`:`<div class="mut">${p.codes.length?"Cód. "+p.codes[0]:""}</div>`}
 <div class="ctl"><button class="add" ${p.price?"":"disabled"} onclick="addRow(${id})">Agregar${p.variants.length>1?" la opción elegida":""}</button>${pq&&p.price?`<button class="add" style="background:#2e7d32" onclick="addRow(${id},${pq})">Agregar ${pq} (promo)</button>`:""}<span class="ing" id="q${id}">${qtyOf(id)?"✓ ×"+qtyOf(id):""}</span></div></div>`}
function openG(i){curG=i;const g=GROUPS[i],q=$("#q").value.toLowerCase().trim();
 const sib=(d)=>{for(let j=i+d;j>=0&&j<GROUPS.length;j+=d)if(GROUPS[j].emp===g.emp)return j;return -1},pv=sib(-1),nx=sib(1);
 $("#mbox").innerHTML=`<div class="ph"><img src="${imgSrc(i)}" alt="" onclick="openZ()"><button class="lupa" onclick="openZ()">🔍 Ampliar</button>${pv>=0?`<button class="nav l" onclick="openG(${pv})" title="Página anterior">‹</button>`:""}${nx>=0?`<button class="nav r" onclick="openG(${nx})" title="Página siguiente">›</button>`:""}</div>
 <div class="rows"><h3>${g.emp} · pág. ${g.page}</h3><div class="mut">Elegí color, tamaño o presentación de lo que ves en la foto. Si la foto sigue, usá las flechas.</div>${g.ids.map(id=>rowHTML(id,q)).join("")}</div>`;
 $("#modal").classList.add("open");hdLoad(i);hdLoad(i+1);hdLoad(i-1)}

let zz=1;const ZL=[1,1.5,2,3,4,6];let zi=0;
function zapply(keep){const c=$("#zc"),im=$("#zi");const fx=keep?(c.scrollLeft+c.clientWidth/2)/Math.max(im.clientWidth,1):.5,fy=keep?(c.scrollTop+c.clientHeight/2)/Math.max(im.clientHeight,1):0;
 im.style.height=(c.clientHeight*ZL[zi])+"px";$("#zl").textContent=Math.round(ZL[zi]*100)+"%";
 c.scrollLeft=fx*im.clientWidth-c.clientWidth/2;c.scrollTop=fy*im.clientHeight-c.clientHeight/2}
function zs(d){zi=d===0?0:Math.max(0,Math.min(ZL.length-1,zi+d));zapply(true)}
function openZ(){if(curG<0)return;$("#zi").src=imgSrc(curG);zi=0;$("#zoom").classList.add("open");setTimeout(()=>zapply(false),30)}
function closeZ(){$("#zoom").classList.remove("open")}
function zpage(d){const g=GROUPS[curG];for(let j=curG+d;j>=0&&j<GROUPS.length;j+=d)if(GROUPS[j].emp===g.emp){openG(j);$("#zi").src=imgSrc(j);zi=0;zapply(false);$("#zc").scrollTop=0;return}}
(()=>{const c=$("#zc");let dn=false,sx,sy,sl,st;c.addEventListener("pointerdown",e=>{if(e.pointerType==="touch")return;dn=true;sx=e.clientX;sy=e.clientY;sl=c.scrollLeft;st=c.scrollTop;c.classList.add("drag")});
 window.addEventListener("pointermove",e=>{if(!dn)return;c.scrollLeft=sl-(e.clientX-sx);c.scrollTop=st-(e.clientY-sy)});window.addEventListener("pointerup",()=>{dn=false;c.classList.remove("drag")});
 c.addEventListener("dblclick",()=>{zi=zi===0?2:0;zapply(true)});c.addEventListener("wheel",e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zs(e.deltaY<0?1:-1)}},{passive:false});window.addEventListener("resize",()=>{if($("#zoom").classList.contains("open"))zapply(true)})})();
function closeM(){$("#modal").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if($("#zoom").classList.contains("open"))closeZ();else closeM()}if($("#zoom").classList.contains("open")){if(e.key==="+"||e.key==="=")zs(1);if(e.key==="-")zs(-1);if(e.key==="0")zs(0);if(e.key==="ArrowLeft")zpage(-1);if(e.key==="ArrowRight")zpage(1);return}if($("#modal").classList.contains("open")){if(e.key==="ArrowLeft")$("#mbox .nav.l")?.click();if(e.key==="ArrowRight")$("#mbox .nav.r")?.click()}});
function addRow(id,n){const s=document.querySelector(`input[name=r${id}]:checked`);add(id,s?+s.value:0,n||1)}
function add(id,vi,qty=1){const k=id+"|"+vi;cart[k]=cart[k]||{q:0,note:""};cart[k].q+=qty;save()}
function chg(k,d){cart[k].q+=d;if(cart[k].q<=0)delete cart[k];save()}
function note(k,v){cart[k].note=v;persist()}
function save(){persist();render();renderCart();document.querySelectorAll("[id^=q]").forEach(el=>{const m=/^q(\d+)$/.exec(el.id);if(m){const n=qtyOf(m[1]);el.textContent=n?"✓ ×"+n:""}})}
function calc(){const ks=Object.keys(cart),amt={},pool={},pk=p=>p.emp+"|"+p.page+"|"+(p.tier?"t":"p"+p.pack[0]+"_"+p.pack[1]);
 ks.forEach(k=>{const p=byId(k.split("|")[0]);if(p.tier||p.pack){const o=pool[pk(p)]=pool[pk(p)]||{m:0,Q:0};o.Q+=cart[k].q}});
 ks.forEach(k=>{const p=byId(k.split("|")[0]),q=cart[k].q,pr=p.price||0;let a=pr*q;
  if(p.tier){const o=pool[pk(p)];let u=pr;p.tier.forEach(([mn,x])=>{if(o.Q>=mn)u=x});a=u*q}
  else if(p.pack){const o=pool[pk(p)],[n,t]=p.pack,cost=m=>Math.floor(m/n)*t+(m%n)*pr;a=cost(o.m+q)-cost(o.m);o.m+=q}
  amt[k]=a});
 const disc=[];BUNDLES.forEach(b=>{const c=Math.min(...b.ids.map(qtyOf)),s=b.ids.reduce((a,id)=>a+(byId(id).price||0),0);if(c>0&&s>b.total)disc.push({name:"Combo: "+b.ids.map(id=>byId(id).title.split(" · ")[0]).join(" + "),n:c,amount:c*(s-b.total)})});
 const t=Object.values(amt).reduce((a,b)=>a+b,0)-disc.reduce((a,d)=>a+d.amount,0);return{amt,disc,t}}
function renderCart(){const C=calc();let c=0;const ks=Object.keys(cart);
 $("#lines").innerHTML=ks.length?ks.map(k=>{const [id,vi]=k.split("|"),p=byId(id),l=cart[k];c+=l.q;const full=(p.price||0)*l.q,a=C.amt[k];
 return`<div class="ln"><div><div class="t">${p.title}</div><div class="mut">${p.variants.length>1?vlabel(p,vi):""}${a<full?` <span style="color:#2e7d32">· promo aplicada</span>`:""}</div><div class="q"><button onclick="chg('${k}',-1)">−</button>${l.q}<button onclick="chg('${k}',1)">+</button></div>
 <input class="n" placeholder="Aclaración (opcional)" value="${l.note}" oninput="note('${k}',this.value)"></div><b>${a<full?`<s style="font-weight:400;color:#999;font-size:11px">${money(full)}</s> `:""}${money(a)}</b></div>`}).join("")+C.disc.map(d=>`<div class="ln"><div><div class="t">${d.name}</div><div class="mut" style="color:#2e7d32">Promo ×${d.n}</div></div><b>−${money(d.amount)}</b></div>`).join(""):"<p style='color:#888'>El carrito está vacío.</p>";
 $("#tot").textContent=money(C.t);$("#cnt").textContent=c;updSend()}
function toggle(){$("#drawer").classList.toggle("open")}
function buildMsg(){const ks=Object.keys(cart),C=calc();let m="*Pedido Ciclo 17*"+($("#cli").value?"\nCliente: "+$("#cli").value:"")+"\n";
 ks.forEach(k=>{const [id,vi]=k.split("|"),p=byId(id),l=cart[k];const code=p.variants.length>1?vlabel(p,vi):(p.codes.length?"("+p.codes[0]+")":"");m+=`\n• ${l.q} x [${p.emp.split(" ")[0]}] ${p.title} ${code}${l.note?" – "+l.note:""} = ${money(C.amt[k])}${C.amt[k]<(p.price||0)*l.q?" (promo)":""}`});
 C.disc.forEach(d=>{m+=`\n• ${d.name} ×${d.n} = −${money(d.amount)}`});
 return m+`\n\n*Total: ${money(C.t)}*`}
function updSend(){const e=!Object.keys(cart).length;$("#send").classList.toggle("off",e);$("#send").href=e?"#":"https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(buildMsg())}
$("#cli").addEventListener("input",updSend);
$("#copy").onclick=async()=>{if(!Object.keys(cart).length)return;try{await navigator.clipboard.writeText(buildMsg().replace(/\*/g,""));$("#cmsg").textContent="Pedido copiado. Pegalo en WhatsApp."}catch(e){$("#cmsg").textContent="No se pudo copiar automáticamente."}};
[...new Set(GROUPS.map(g=>g.emp))].forEach(e=>{const o=document.createElement("option");o.value=o.textContent=e;$("#emp").appendChild(o)});
$("#emp").onchange=render;$("#q").oninput=render;$("#cartbtn").onclick=toggle;
render();renderCart();
</script></body></html>
